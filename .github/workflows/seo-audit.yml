name: SEO Audit

on:
  push:
    branches: [ main, 'seo/**' ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
      - name: Run seo_audit
        run: |
          python scripts/seo_audit.py
